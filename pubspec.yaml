name: scandis
description: ScanDis — AI-powered Document Scanner App (Flutter, Android/iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---------- Camera & Document Edge Detection ----------
  image_picker: ^1.1.2
  flutter_doc_scanner: ^0.0.14      # wraps native ML Kit Document Scanner (Android) / VisionKit (iOS)
  image: ^4.2.0                     # for grayscale / contrast filters

  # ---------- OCR (on-device) ----------
  google_mlkit_text_recognition: ^0.13.1

  # ---------- PDF Generation ----------
  pdf: ^3.11.1
  printing: ^5.13.4

  # ---------- Local Storage ----------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # ---------- Networking (Gemini API) ----------
  http: ^1.2.2

  # ---------- State Management ----------
  provider: ^6.1.2

  # ---------- Utilities ----------
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# ---------- App Icon Generator ----------
# Run this once (or whenever you change the icon):
#   flutter pub get
#   flutter pub run flutter_launcher_icons
# This generates all required Android/iOS icon sizes automatically.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
