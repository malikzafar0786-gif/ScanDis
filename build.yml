name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code (only lib/, pubspec.yaml, assets/ are tracked)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java (required by Gradle/Android)
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Flutter — always the LATEST stable release, so this workflow
      #    never goes stale and you never need to bump a version number.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Scaffold native android/ + ios/ folders FRESH every run, matching
      #    whatever Flutter/Gradle/Kotlin versions are current today.
      #    This is why android/ and ios/ do NOT need to live in the repo —
      #    no more version-mismatch build failures, ever.
      - name: Generate native platform folders
        run: flutter create --platforms=android,ios --org com.scandis --project-name scandis .

      # 4d. Add ProGuard keep-rules for ML Kit text recognition.
      #     This is Google's own documented fix for the
      #     "Missing class ...KoreanTextRecognizerOptions" R8 error —
      #     more reliable than trying to disable minification.
      - name: Add ML Kit ProGuard rules
        run: |
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro << 'PROGUARD_EOF'

          # ML Kit text recognition — keep all script-specific recognizer
          # classes so R8 doesn't strip them (fixes minifyReleaseWithR8 crash)
          -keep class com.google.mlkit.vision.text.** { *; }
          -keep class com.google.mlkit.vision.text.chinese.** { *; }
          -keep class com.google.mlkit.vision.text.japanese.** { *; }
          -keep class com.google.mlkit.vision.text.korean.** { *; }
          -keep class com.google.mlkit.vision.text.devanagari.** { *; }
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          PROGUARD_EOF

          # Make sure build.gradle(.kts) actually references this file,
          # in case the generated template didn't wire it in.
          python3 - <<'EOF'
          import re, os
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  content = f.read()
              if "proguard-rules.pro" not in content:
                  print(f"⚠️ {path} does not reference proguard-rules.pro — check manually if build still fails")
              else:
                  print(f"✅ {path} already references proguard-rules.pro")
          EOF

      # 4b. Also disable R8 minification as a second safety net (belt and
      #     suspenders — either fix alone should be enough on its own).
      - name: Disable R8 minification (fixes ML Kit build failure)
        run: |
          python3 - <<'EOF'
          import re, os

          candidates = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle",
          ]
          for path in candidates:
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  content = f.read()
              original = content

              # Kotlin DSL — flexible whitespace, with or without quotes
              content = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', content)
              content = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', content)
              # Groovy DSL
              content = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', content)
              content = re.sub(r'shrinkResources\s+true', 'shrinkResources false', content)

              if content != original:
                  with open(path, "w") as f:
                      f.write(content)
                  print(f"✅ Patched {path}: R8 minification disabled")
              else:
                  print(f"⚠️ No minify=true flags found in {path} — nothing to patch")
          EOF

      # 4c. Debug: print the actual buildTypes block so we can verify the
      #     patch applied correctly (visible in the Actions log).
      - name: Show buildTypes config (debug)
        run: |
          echo "----- android/app/build.gradle.kts (or .gradle) buildTypes section -----"
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              echo "== $f =="
              grep -n -A 8 "buildTypes" "$f" || true
            fi
          done

      # 5. Auto-insert required Android permissions (camera + storage)
      #    into the freshly generated AndroidManifest.xml.
      - name: Add required Android permissions
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n'
          )
          if "android.permission.CAMERA" not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
          print("AndroidManifest.xml patched with permissions")
          EOF

      # 6. Auto-insert camera usage description into iOS Info.plist
      #    (harmless on this Android-only build, keeps iOS ready for later).
      - name: Add required iOS permissions
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              content = f.read()
          if "NSCameraUsageDescription" not in content:
              addition = "  <key>NSCameraUsageDescription</key>\n  <string>We need camera access to scan your documents.</string>\n"
              content = content.replace("</dict>", addition + "</dict>", 1)
              with open(path, "w") as f:
                  f.write(content)
          print("Info.plist patched with camera usage description")
          EOF

      # 7. Fetch dependencies
      - name: Install dependencies
        run: flutter pub get

      # 8. Generate Hive adapter (scanned_document.g.dart) etc.
      - name: Run build_runner (code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 9. Generate app icons (Android + iOS) from assets/icon/app_icon.png
      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      # 10. Static analysis (non-blocking — just informative)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # 11. Build the release APK.
      #     Add GEMINI_API_KEY as a repo secret:
      #     Settings → Secrets and variables → Actions → New repository secret
      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # 12. Copy APK to a predictable filename
      - name: Copy APK to root workspace
        run: cp build/app/outputs/flutter-apk/app-release.apk ScanDis-release.apk

      # 13. Upload as downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanDis-release-apk
          path: ScanDis-release.apk
          retention-days: 30
