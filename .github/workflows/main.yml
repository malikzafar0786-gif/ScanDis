name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate pubspec directory safely
        id: locate
        run: |
          TARGET_DIR=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path '*/.*' -exec dirname {} \; | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi
          echo "dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Rebuild Android Platform Cleanly
        run: |
          cd ${{ steps.locate.outputs.dir }}
          rm -rf android
          flutter create . --platforms=android --org com.docscanner.app
          flutter clean

      - name: Apply Android Fixes
        run: |
          cd ${{ steps.locate.outputs.dir }}
          
          # Fix minSdkVersion in build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle || true
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts || true
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts || true
          fi
          
          # Force AndroidX properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install Dependencies
        run: |
          cd ${{ steps.locate.outputs.dir }}
          flutter pub get

      - name: Build APK (Release)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ steps.locate.outputs.dir }}
          flutter build apk --release --no-tree-shake-icons

      - name: Copy APK to Root Workspace
        run: |
          APK_PATH=$(find . -name "app-release.apk" | head -n 1)
          mkdir -p output_apk
          cp "$APK_PATH" output_apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output_apk/app-release.apk
