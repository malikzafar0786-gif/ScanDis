name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Locate pubspec directory
        id: locate
        run: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "dir=$TARGET_DIR" >> $GITHUB_OUTPUT

      - name: Rebuild Android Platform Correctly
        run: |
          cd ${{ steps.locate.outputs.dir }}
          rm -rf android
          flutter create . --platforms=android --org com.docscanner.app

      - name: Update Gradle Properties and Min SDK
        run: |
          cd ${{ steps.locate.outputs.dir }}/android
          
          # Force minSdkVersion 21 in build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' app/build.gradle
          sed -i 's/flutter.minSdkVersion/21/g' app/build.gradle
          
          # Add build optimization flags
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Install Dependencies
        run: |
          cd ${{ steps.locate.outputs.dir }}
          flutter pub get

      - name: Build APK (Release)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ steps.locate.outputs.dir }}
          flutter build apk --release --no-tree-shake-icons --build-number=1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: /**/build/app/outputs/flutter-apk/app-release.apk
