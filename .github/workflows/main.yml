name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Find Flutter project directory
        id: find_dir
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "working_dir=." >> $GITHUB_OUTPUT
          else
            DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
            echo "working_dir=$DIR" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        working-directory: ${{ steps.find_dir.outputs.working_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_dir.outputs.working_dir }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            ${{ steps.find_dir.outputs.working_dir }}/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
