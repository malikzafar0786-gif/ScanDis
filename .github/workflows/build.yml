name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate native platform folders
        run: flutter create --platforms=android,ios --org com.scandis --project-name scandis .

      - name: Disable R8 minification (fixes ML Kit build failure)
        run: |
          python3 - <<'EOF'
          import os

          candidates = [
              "android/app/build.gradle.kts",
              "android/app/build.gradle",
          ]
          for path in candidates:
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  content = f.read()
              original = content
              content = content.replace("isMinifyEnabled = true", "isMinifyEnabled = false")
              content = content.replace("isShrinkResources = true", "isShrinkResources = false")
              content = content.replace("minifyEnabled true", "minifyEnabled false")
              content = content.replace("shrinkResources true", "shrinkResources false")
              if content != original:
                  with open(path, "w") as f:
                      f.write(content)
                  print(f"Patched {path}: R8 minification disabled")
              else:
                  print(f"No minify flags found in {path}")
          EOF

      - name: Add required Android permissions
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n'
          )
          if "android.permission.CAMERA" not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
          print("AndroidManifest.xml patched with permissions")
          EOF

      - name: Add required iOS permissions
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              content = f.read()
          if "NSCameraUsageDescription" not in content:
              addition = "  <key>NSCameraUsageDescription</key>\n  <string>We need camera access to scan your documents.</string>\n"
              content = content.replace("</dict>", addition + "</dict>", 1)
              with open(path, "w") as f:
                  f.write(content)
          print("Info.plist patched with camera usage description")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner (code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Copy APK to root workspace
        run: cp build/app/outputs/flutter-apk/app-release.apk ScanDis-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanDis-release-apk
          path: ScanDis-release.apk
          retention-days: 30
