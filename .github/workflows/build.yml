
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code (only lib/, pubspec.yaml, assets/ are tracked)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java (required by Gradle/Android)
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Flutter — always the LATEST stable release, so this workflow
      #    never goes stale and you never need to bump a version number.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Scaffold native android/ + ios/ folders FRESH every run, matching
      #    whatever Flutter/Gradle/Kotlin versions are current today.
      #    This is why android/ and ios/ do NOT need to live in the repo —
      #    no more version-mismatch build failures, ever.
      - name: Generate native platform folders
        run: flutter create --platforms=android,ios --org com.scandis --project-name scandis .

      # 4d. Add ProGuard rules for ML Kit + Play Services.
      #     IMPORTANT: Flutter's own docs confirm R8 code shrinking is
      #     ALWAYS enabled in release builds — it cannot be turned off,
      #     so the only real fix is telling R8 to ignore references to
      #     ML Kit script classes that aren't actually bundled (they're
      #     referenced reflectively by the plugin but not present unless
      #     you explicitly depend on them — hence "missing class" errors).
      #     -dontwarn (not -keep) is what actually fixes "missing class"
      #     errors, since -keep can't preserve a class that isn't there.
      - name: Add ProGuard rules (ML Kit / Play Services)
        run: |
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro << 'PROGUARD_EOF'

          # ---- ML Kit text recognition + Play Services: prevent R8 from
          # ---- erroring on optional script classes that aren't bundled.
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.android.gms.**
          -keep class com.google.android.odml.** { *; }
          -dontwarn com.google.android.odml.**
          PROGUARD_EOF

          python3 - <<'EOF'
          import os
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  content = f.read()
              print(f"✅ {path} references proguard-rules.pro: {'proguard-rules.pro' in content}")
          EOF

      # 5. Auto-insert required Android permissions (camera + storage)
      #    into the freshly generated AndroidManifest.xml.
      - name: Add required Android permissions
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n'
          )
          if "android.permission.CAMERA" not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
          print("AndroidManifest.xml patched with permissions")
          EOF

      # 6. Auto-insert camera usage description into iOS Info.plist
      #    (harmless on this Android-only build, keeps iOS ready for later).
      - name: Add required iOS permissions
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              content = f.read()
          if "NSCameraUsageDescription" not in content:
              addition = "  <key>NSCameraUsageDescription</key>\n  <string>We need camera access to scan your documents.</string>\n"
              content = content.replace("</dict>", addition + "</dict>", 1)
              with open(path, "w") as f:
                  f.write(content)
          print("Info.plist patched with camera usage description")
          EOF

      # 7. Fetch dependencies
      - name: Install dependencies
        run: flutter pub get

      # 8. Generate Hive adapter (scanned_document.g.dart) etc.
      - name: Run build_runner (code generation)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 9. Generate app icons (Android + iOS) from assets/icon/app_icon.png
      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      # 10. Static analysis (non-blocking — just informative)
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # 11. Build the release APK.
      #     Add GEMINI_API_KEY as a repo secret:
      #     Settings → Secrets and variables → Actions → New repository secret
      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # 11b. If the build still fails, R8 writes an exact list of the
      #      missing/keep rules it needed to build/app/outputs/mapping/
      #      release/missing_rules.txt — upload it so we can read the
      #      precise fix instead of guessing next time.
      - name: Upload R8 missing-rules report (only if build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules-report
          path: |
            build/app/outputs/mapping/release/missing_rules.txt
            build/app/outputs/mapping/release/*.txt
          if-no-files-found: ignore

      # 12. Copy APK to a predictable filename
      - name: Copy APK to root workspace
        run: cp build/app/outputs/flutter-apk/app-release.apk ScanDis-release.apk

      # 13. Upload as downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanDis-release-apk
          path: ScanDis-release.apk
          retention-days: 30
